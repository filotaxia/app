<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>QR de los terrarios · Filotaxia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
        /* ============================================
           Herramientas — Imprimir QR
           ============================================ */

        /* Hoja interna (no está enlazada desde la app): un QR por terrario,
           listo para imprimir y pegar en la base de cada uno. */

        .qr-page {
            display: flex;
            flex-direction: column;
            gap: var(--gap-xl);
            padding-block: var(--spacing-3xl);
        }

        .qr-page__controls {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: var(--gap-lg);
        }

        .qr-page__controls .field {
            flex: 1;
            min-width: 260px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--gap-xl);
        }

        .qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap-sm);
            padding: var(--spacing-lg);
            border: 1px solid var(--color-line);
            border-radius: var(--radius-sm);
            text-align: center;
            break-inside: avoid;
        }

        .qr-card svg {
            width: 100%;
            max-width: 160px;
            height: auto;
        }

        .qr-card__name {
            font-size: var(--font-sm-size);
            line-height: var(--font-sm-line);
            font-weight: var(--font-weight-medium);
        }

        .qr-card__url {
            font-size: var(--font-2xs-size);
            line-height: var(--font-2xs-line);
            color: var(--color-text-muted);
            word-break: break-all;
        }

        /* ============================================
        RESPONSIVE
        ============================================ */

        @media (min-width: 640px) {
            .qr-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media print {
            .qr-page__intro,
            .qr-page__controls {
                display: none;
            }

            .qr-page {
                padding: 0;
            }

            .qr-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>
    <main class="qr-page container">
        <header class="qr-page__intro">
            <p class="eyebrow">Herramienta interna</p>
            <h1 class="title">QR de los terrarios</h1>
            <p class="lead">Cada QR es el link a la ficha del terrario. Con la cámara de cualquier celular se abre
                directo en Filotaxia. Revisá que la dirección sea la de la app publicada (https) antes de imprimir.</p>
        </header>

        <form class="qr-page__controls" data-form>
            <div class="field">
                <label class="field__label eyebrow" for="base">Dirección de la app</label>
                <input class="field__input" id="base" name="base" type="url" required />
            </div>
            <button class="btn btn--primary" type="button" data-print>Imprimir</button>
        </form>

        <div class="qr-grid" data-grid></div>
    </main>

    <script type="module">
        /* ============================================
           Herramientas — Imprimir QR
           ============================================ */

        // Genera un QR (SVG) por terrario del catálogo con qrcode-generator (MIT, CDN).
        import qrcode from "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm";
        import { TERRARIOS } from "./src/content/terrarios.js";
        import { escapeHTML } from "./src/utils/html.js";

        const form = document.querySelector("[data-form]");
        const grid = document.querySelector("[data-grid]");

        // Por defecto: la dirección desde la que se abrió esta hoja
        form.elements.base.value = new URL("./", location.href).href;

        function render() {
            const base = form.elements.base.value.trim().replace(/\/?$/, "/");
            grid.innerHTML = TERRARIOS.map((terrario) => {
                const url = `${base}#/terrario/${terrario.id}`;
                const qr = qrcode(0, "M");   // 0 = tamaño automático · M = tolera ~15% de daño
                qr.addData(url);
                qr.make();
                return `
                    <article class="qr-card">
                        ${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}
                        <p class="eyebrow">Nº ${escapeHTML(terrario.id)}</p>
                        <p class="qr-card__name">${escapeHTML(terrario.name)}</p>
                        <p class="qr-card__url">${escapeHTML(url)}</p>
                    </article>
                `;
            }).join("");
        }

        form.elements.base.addEventListener("input", render);
        document.querySelector("[data-print]").addEventListener("click", () => window.print());
        render();
    </script>
</body>

</html>
