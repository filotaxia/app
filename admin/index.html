<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <title>Panel · Filotaxia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Página interna: sin link desde la app y fuera de los buscadores -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Color de la barra del navegador: uno por esquema; utils/theme.js los
         actualiza cuando se fuerza claro u oscuro desde Ajustes -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <link rel="icon" type="image/png" href="../src/assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <link rel="preload" href="../src/assets/fonts/ppneuemontreal-medium.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="../src/styles.css" />
</head>

<body>
    <!-- El panel de carga de terrarios (src/views/admin/): entrar, lista,
         alta y edición, QR. Pinta cada pantalla adentro de <main>. -->
    <main class="admin container" data-admin tabindex="-1"></main>

    <!-- La misma barra del front (layout/bottom-nav), con las páginas del
         panel en vez de las de la app: Terrarios, Nuevo, Imprimir, Backups.
         admin.js la muestra/oculta y marca la activa, igual que router.js. -->
    <nav class="bottom-nav" aria-label="Secciones" data-nav hidden>
        <a class="bottom-nav__brand" href="#/">Panel</a>
        <ul class="bottom-nav__list bottom-nav__list--panel">
            <li>
                <a class="bottom-nav__link" href="#/" data-route="lista" aria-label="Terrarios">
                    <!-- Lucide: list -->
                    <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12h.01" /><path d="M3 18h.01" /><path d="M3 6h.01" />
                        <path d="M8 12h13" /><path d="M8 18h13" /><path d="M8 6h13" />
                    </svg>
                </a>
            </li>
            <li>
                <a class="bottom-nav__link" href="#/nuevo" data-route="nuevo" aria-label="Nuevo terrario">
                    <!-- Lucide: plus -->
                    <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" /><path d="M12 5v14" />
                    </svg>
                </a>
            </li>
            <li>
                <a class="bottom-nav__link" href="#/imprimir" data-route="imprimir" aria-label="Imprimir QR">
                    <!-- Lucide: qr-code -->
                    <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="5" height="5" x="3" y="3" rx="1" /><rect width="5" height="5" x="16" y="3" rx="1" />
                        <rect width="5" height="5" x="3" y="16" rx="1" />
                        <path d="M21 16h-3a2 2 0 0 0-2 2v3" /><path d="M21 21v.01" /><path d="M12 7v3a2 2 0 0 1-2 2H7" />
                        <path d="M3 12h.01" /><path d="M12 3h.01" /><path d="M12 16v.01" /><path d="M16 12h1" />
                        <path d="M21 12v.01" /><path d="M12 21v-1" />
                    </svg>
                </a>
            </li>
            <li>
                <a class="bottom-nav__link" href="#/backups" data-route="backups" aria-label="Backups">
                    <!-- Lucide: calendar -->
                    <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" />
                        <path d="M3 10h18" />
                    </svg>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Avisos breves (components/toast) -->
    <div class="toast-region" data-toast-region aria-live="polite"></div>

    <script type="module" src="../src/views/admin/admin.js"></script>
</body>

</html>
