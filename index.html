<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <title>Filotaxia</title>
    <!-- viewport-fit=cover: la app usa toda la pantalla y respeta las áreas seguras (notch, barra de inicio) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Escuchá el sonido de tu terrario." />
    <!-- Color de la barra del navegador, uno por esquema (utils/theme.js los pisa si se fuerza un tema) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <!-- App instalable (PWA): ícono y nombre en la pantalla de inicio.
         Android usa los íconos del manifest; el iPhone no: usa apple-touch-icon
         (PNG de 180×180 sin transparencia). Vive en la raíz porque es donde iOS
         lo busca si no encuentra este link. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./src/assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Filotaxia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Tipografía: PP Neue Montreal, local (src/styles/base/fonts.css); se precarga el corte de texto -->
    <link rel="preload" href="./src/assets/fonts/ppneuemontreal-medium.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
    <a class="skip-link" href="#view">Saltar al contenido</a>

    <div class="app-shell" data-app-shell>
        <!-- LAYOUT: Header (solo en las vistas que lo piden: Terrarios, Cuidados, Bitácora, Ajustes).
             Ajustes a la derecha, como el avatar de Pulso (components/settings-link) -->
        <header class="app-header" data-header hidden>
            <div class="app-header__inner container">
                <div class="app-header__lead">
                    <a class="app-header__back" href="#/coleccion" data-header-back hidden aria-label="Volver">
                        <!-- Lucide: chevron-left -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </a>
                    <div class="app-header__titles">
                        <h1 class="app-header__title" data-header-title tabindex="-1">Filotaxia</h1>
                        <p class="app-header__subtitle" data-header-subtitle></p>
                    </div>
                </div>
                <a class="settings-link" href="#/ajustes" data-header-settings aria-label="Ajustes">
                    <span class="settings-link__dot" aria-hidden="true"></span>
                </a>
            </div>
        </header>

        <!-- LAYOUT: View (el router monta acá cada pantalla) -->
        <main id="view" class="app-view" tabindex="-1"></main>

        <!-- LAYOUT: Bottom-Nav (estructura de Pulso): Mi terrario · Colección · Filotaxia ·
             Manifiesto · Guía, y al final el reproductor (no navega). Probando un estilo
             nuevo: la barra es siempre inversa al tema (negra en claro, blanca en oscuro
             — --color-inverse-bg/-text, no sigue el tema como antes) y solo íconos, sin
             label visible (aria-label en el link); la sección activa es un círculo del
             color de la página (el inverso del inverso), no un fondo suave. Conectar (el
             escáner, #/escanear) ya no está acá: se llega desde Mi terrario o el QR
             chico del bloque Pieza. Filotaxia (el catálogo de formas y ondas:
             views/formas-ondas) lleva un rombo, no ya el isotipo de la marca; también
             se llega por la card "Plantas."
             (components/plants-block). El reproductor (data-nav-player, conectado en
             layout/player-dock) no es un link: muestra u oculta la franja/barra del
             reproductor, que arranca invisible (ya no flota siempre arriba de la barra).
             Riel lateral en desktop. Ajustes está en el header. En todas las pantallas
             menos el splash y el Manifiesto del primer escaneo. -->
        <nav class="bottom-nav" aria-label="Secciones" data-nav hidden>
            <a class="bottom-nav__brand" href="#/mi-terrario">Filotaxia</a>
            <ul class="bottom-nav__list">
                <li>
                    <a class="bottom-nav__link" href="#/mi-terrario" data-route="mi-terrario" aria-label="Mi terrario">
                        <!-- Mi terrario (#/mi-terrario). Ícono: un terrario propio, con el
                             trazo de Lucide: la pecera redonda del TR01,
                             la línea del sustrato y un brote adentro. El viewBox recorta el margen
                             para que se vea del mismo tamaño que los otros íconos -->
                        <svg class="bottom-nav__icon bottom-nav__icon--terrario" viewBox="2.5 2.5 19 19" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M8.5 4.5h7" />
                            <path d="M8.5 4.5C5.8 5.9 4 8.7 4 12a8 8 0 0 0 16 0c0-3.3-1.8-6.1-4.5-7.5" />
                            <path d="M5 15.5h14" />
                            <path d="M12 15.5v-4.5" />
                            <path d="M12 13c-1.8 0-3-1.2-3-3 1.8 0 3 1.2 3 3z" />
                            <path d="M12 12c1.8 0 3-1.2 3-3-1.8 0-3 1.2-3 3z" />
                        </svg>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/coleccion" data-route="coleccion" aria-label="Colección">
                        <!-- Lucide: layout-grid -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect width="7" height="7" x="3" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="14" rx="1" />
                            <rect width="7" height="7" x="3" y="14" rx="1" />
                        </svg>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/formas-ondas" data-route="formas-ondas" aria-label="Filotaxia">
                        <!-- Lucide: leaf (la forma de la hoja define la onda) -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-11 10Z" />
                            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
                        </svg>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/manifiesto" data-route="manifiesto" aria-label="Manifiesto">
                        <!-- Lucide: book-open -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 7v14" />
                            <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
                        </svg>
                    </a>
                </li>
                <li>
                    <a class="bottom-nav__link" href="#/filotaxia" data-route="filotaxia" aria-label="Guía">
                        <!-- Lucide: route (la Guía es "Tu recorrido": del primer paso al último) -->
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="6" cy="19" r="3" />
                            <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                            <circle cx="18" cy="5" r="3" />
                        </svg>
                    </a>
                </li>
                <li class="bottom-nav__sep" aria-hidden="true"><span class="bottom-nav__sep-line"></span></li>
                <li>
                    <!-- El reproductor (layout/player-dock): no navega, muestra u
                         oculta la barra del reproductor (components/now-playing), que
                         arranca invisible. Ícono Lucide: audio-lines (no "play": no
                         pausa/reproduce, solo abre y cierra) -->
                    <button class="bottom-nav__link" type="button" data-nav-player aria-label="Reproductor">
                        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 10v3" />
                            <path d="M6 6v11" />
                            <path d="M10 3v18" />
                            <path d="M14 8v7" />
                            <path d="M18 5v13" />
                            <path d="M22 10v3" />
                        </svg>
                    </button>
                </li>
                <!-- La píldora (layout/player-dock): oculta (ancho 0) hasta que se
                     toca el ícono de arriba; ahí la barra se extiende y aparece la
                     foto del terrario que suena con el play/pause encima, como un
                     ícono más. Tocar la foto (afuera del play) lleva a la Pieza. -->
                <li class="bottom-nav__pill" data-nav-pill>
                    <a class="bottom-nav__pill-tap" data-pill-tap aria-label="Ver la pieza">
                        <span class="bottom-nav__pill-art" data-pill-art aria-hidden="true"></span>
                    </a>
                    <button class="bottom-nav__pill-play" type="button" data-pill-play aria-label="Reproducir" aria-pressed="false"></button>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Avisos breves (components/toast) -->
    <div class="toast-region" data-toast-region aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
